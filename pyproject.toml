[project]
name = "hyperchat"
version = "0.1.0"
description = "A containerised agent on Cloud Run, deployed by CI"
readme = "README.md"
requires-python = ">=3.13"
# `fastapi`, not `fastapi[standard]`. The extra brings `fastapi-cli` and `fastapi-cloud-cli`, whose
# subtree is FastAPI's hosted path -- telemetry, an installer detector, a cloud CLI -- and none of it is
# reached here: the image's `CMD` is `uvicorn` directly, and nothing in this repository runs
# `fastapi dev` or `fastapi run`. Declaring only what is imported keeps the supply-chain surface equal
# to the code that uses it.
#
# uvicorn is declared because it is now the only thing that provides the server the image runs.
dependencies = [
    "fastapi>=0.162.2",
    "langchain-core>=1.8.0",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.20",
    # Imported directly by `hyperchat.tracing` for the decision it reports, not only through
    # `langchain-core`: declaring what is imported is the rule the comment above states, and a
    # transitive dependency is one an upgrade elsewhere can drop.
    "langsmith>=0.14.17",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

# `httpx2`, not `httpx`, and the name is the whole point of the measurement: Starlette's TestClient does
# `import httpx2 as httpx` and only falls back to `httpx` under a `StarletteDeprecationWarning`. With
# `filterwarnings = ["error"]` above, that fallback is a collection error, so declaring `httpx` -- the
# obvious reading of "the test client needs httpx" -- fails the suite at import. It used to pass only
# because `fastapi[standard]` dragged `httpx2` in through `fastapi-cloud-cli`, which is the coupling now
# written down instead of inherited.
[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
# The code is written to ~100 columns already; 88 is ruff's default and would fight every comment.
line-length = 100
target-version = "py313"
# No `select` on purpose. ruff's default set is broader than E/F and includes rules that have already
# earned their place here: PLW1510 caught a `subprocess.run` whose caller asserts on `returncode`, and
# narrowing the selection to the familiar families would have silently disabled it. Adding a `select`
# should be a decision with a reason, not a tidying.
